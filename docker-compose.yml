# kali-relay — 声明式启动方式
#
# 与 start-relay.ps1 等价，二选一即可：
#   PowerShell/Windows : .\start-relay.ps1 -t 198.51.100.10
#   Compose            : $env:TARGET_IP='198.51.100.10'; docker compose up -d
#
# 安全边界（有意为之，请勿改动）：
#   * 不使用 network_mode: host
#   * 不声明任何 ports（不向宿主机发布端口）
#   * 只给 NET_ADMIN / NET_RAW 两项能力，其余保持默认

name: kali-relay

services:
  relay:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        KALI_BASE_TAG: ${KALI_BASE_TAG:-latest}
    image: kali-relay:latest
    container_name: kali-relay
    hostname: kali-relay
    restart: unless-stopped

    networks:
      - relay-net

    # 配置 iptables NAT 与抓包需要这两项能力
    cap_add:
      - NET_ADMIN
      - NET_RAW

    # 允许内核把 127/8 视作可转发目标
    sysctls:
      net.ipv4.conf.all.route_localnet: "1"
      net.ipv4.conf.default.route_localnet: "1"

    environment:
      TARGET_IP: ${TARGET_IP:?TARGET_IP is required, e.g. 198.51.100.10}

    labels:
      kali-relay.target-ip: "${TARGET_IP}"
      kali-relay.managed-by: "docker-compose"

    # 规则就绪即视为健康
    healthcheck:
      test: ["CMD-SHELL", "iptables -t nat -S KALI-RELAY >/dev/null 2>&1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

    stop_grace_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  relay-net:
    name: kali-relay-net
    driver: bridge
    # 固定网段便于验收脚本稳定取值；若与你的内网/VPN 冲突，改这里（同时改 start-relay.ps1 的 $NetworkSubnet）
    ipam:
      config:
        - subnet: 172.28.0.0/24
